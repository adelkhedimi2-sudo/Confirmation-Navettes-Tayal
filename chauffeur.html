<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infos du Chauffeur - En Direct</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; overflow: hidden; position: relative; }
        
        .card-header { background: linear-gradient(135deg, #003366, #1565C0); color: white; padding: 20px; text-align: center; border-bottom: 4px solid #FF9800; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .stamp-logo-card { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid #FF9800; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .card-header h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
        
        .card-body { padding: 30px 20px; text-align: center; }
        .avatar { font-size: 55px; margin-bottom: 5px; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .driver-name { font-size: 24px; font-weight: 900; color: #1e293b; margin-bottom: 8px; }
        
        /* نوع السيارة */
        .car-type { font-size: 15px; color: #0284c7; font-weight: 800; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; background: #e0f2fe; display: inline-block; padding: 6px 16px; border-radius: 20px; border: 1px solid #bae6fd; }
        
        .info-container { margin-bottom: 20px; }
        .info-label { font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* خانة عرض رقم الهاتف (نص ثابت بدون اتصال) */
        .phone-display-box { 
            background: #f8fafc; 
            border: 2px solid #cbd5e1; 
            border-radius: 10px; 
            padding: 12px; 
            font-size: 22px; 
            font-weight: 900; 
            font-family: 'Courier New', monospace; 
            color: #0f172a; 
            display: inline-block; 
            letter-spacing: 3px; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03); 
            width: 85%; 
        }
        
        /* لوحة الترقيم */
        .plate-box { background: #facc15; border: 3px solid #111; border-radius: 8px; padding: 8px 15px; display: inline-block; font-size: 20px; font-weight: 900; font-family: 'Courier New', monospace; letter-spacing: 2px; color: #000; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }
        
        .empty-state { padding: 40px 20px; text-align: center; color: #64748b; }
        .empty-icon { font-size: 50px; margin-bottom: 15px; opacity: 0.5; }
        
        .live-badge { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 12px; color: #10b981; font-weight: bold; padding: 15px; background: #f8fafc; border-top: 1px solid #e2e8f0; }
        .pulse { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="empty-state">
            <div class="empty-icon">⏳</div>
            <h3>Chargement en cours...</h3>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dsmflhnjmnllvhkuepit.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzbWZsaG5qbW5sbHZoa3VlcGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDkzNDksImV4cCI6MjEwODU4NTM0OX0.lZTNCcKa_GW22fIPNGvDyH-sJ-zIyUUySiBtLS7tDmM";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadDriver() {
            const params = new URLSearchParams(window.location.search);
            const busName = params.get('bus');
            const card = document.getElementById('mainCard');
            
            if(!busName) {
                card.innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><h3>Navette non spécifiée</h3></div>`;
                return;
            }

            try {
                let { data: drivers, error } = await supabaseClient.from('chauffeurs_navette').select('*').eq('bus', busName);
                
                if (drivers && drivers.length > 0) {
                    const d = drivers[0];
                    const vehiculeType = d.type_voiture ? d.type_voiture : 'Véhicule standard';
                    const telNum = d.telephone ? d.telephone : 'Non disponible';
                    const matNum = d.matricule ? d.matricule : '---';

                    card.innerHTML = `
                        <div class="card-header">
                            <img src="Stamp.png" alt="Adel Khedimi Mgx" class="stamp-logo-card">
                            <h2>🚌 Navette : ${busName}</h2>
                        </div>
                        <div class="card-body">
                            <div class="avatar">👨‍✈️</div>
                            <div class="driver-name">${d.nom_chauffeur}</div>
                            <div class="car-type">🚘 ${vehiculeType}</div>
                            
                            <div class="info-container">
                                <div class="info-label">Numéro de Téléphone</div>
                                <div class="phone-display-box">${telNum}</div>
                            </div>

                            <div class="info-container">
                                <div class="info-label">Matricule du Véhicule</div>
                                <div class="plate-box">${matNum}</div>
                            </div>
                        </div>
                        <div class="live-badge">
                            <div class="pulse"></div> Données synchronisées en direct
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="card-header" style="background: #64748b; border-bottom: 4px solid #94a3b8;">
                            <img src="Stamp.png" alt="Adel Khedimi Mgx" class="stamp-logo-card">
                            <h2>🚌 Navette : ${busName}</h2>
                        </div>
                        <div class="empty-state">
                            <div class="empty-icon">🕒</div>
                            <h3 style="color:#334155; margin-bottom:10px;">Chauffeur non affecté</h3>
                            <p style="font-size:14px; margin:0; line-height:1.5;">Le chauffeur pour cette navette sera affiché ici dès qu'il sera affecté <br><b>(Généralement le Jeudi)</b>.</p>
                        </div>
                        <div class="live-badge" style="color:#64748b;">
                            <div class="pulse" style="background:#64748b;"></div> En attente de mise à jour...
                        </div>
                    `;
                }
            } catch (err) {
                card.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Erreur de connexion</h3></div>`;
            }
        }

        loadDriver();
        supabaseClient.channel('public:chauffeurs_navette').on('postgres_changes', { event: '*', schema: 'public', table: 'chauffeurs_navette' }, payload => { loadDriver(); }).subscribe();
    </script>
</body>
</html>
