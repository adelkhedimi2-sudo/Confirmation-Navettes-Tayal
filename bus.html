<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statut de la Navette - En Direct</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { color: #003366; text-align: center; font-size: 22px; border-bottom: 2px solid #FF9800; padding-bottom: 10px; margin-top: 0; }
        
        /* تنسيق عداد المؤكدين */
        .counter-box {
            background-color: #e3f2fd;
            border: 2px solid #1565c0;
            color: #0d47a1;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .list-group { list-style: none; padding: 0; margin: 0; }
        .list-item { padding: 15px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; transition: background-color 0.3s; }
        .list-item:last-child { border-bottom: none; }
        .emp-name { font-weight: 600; color: #334155; font-size: 16px; }
        
        /* تنسيق الألوان والحالات */
        .status-ok { color: #16a34a; font-weight: bold; background: #dcfce7; padding: 6px 12px; border-radius: 20px; font-size: 14px; }
        .status-retour { color: #9333ea; font-weight: bold; background: #f3e5f5; padding: 6px 12px; border-radius: 20px; font-size: 14px; border: 1px solid #c084fc; }
        .status-wait { color: #ea580c; font-weight: bold; background: #ffedd5; padding: 6px 12px; border-radius: 20px; font-size: 14px; }
        .status-cancel { color: #dc2626; font-weight: bold; background: #fee2e2; padding: 6px 12px; border-radius: 20px; font-size: 14px; }
        
        .loading { text-align: center; color: #64748b; font-style: italic; margin: 20px 0; }
        
        .live-indicator { display: inline-block; width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; animation: pulse 1.5s infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .live-text { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 20px; font-weight: bold; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1 id="busTitle">⏳ Chargement de la navette...</h1>
        
        <div id="passengerCounter" class="counter-box">
            Nombre total de personnes confirmées : 0
        </div>

        <div class="live-text">
            <span class="live-indicator"></span> Mises à jour automatiques activées
        </div>
        
        <div id="loading" class="loading">Chargement des données...</div>
        <ul class="list-group" id="passengersList"></ul>
    </div>

    <script>
        const SUPABASE_URL = "https://dsmflhnjmnllvhkuepit.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzbWZsaG5qbW5sbHZoa3VlcGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDkzNDksImV4cCI6MjEwODU4NTM0OX0.lZTNCcKa_GW22fIPNGvDyH-sJ-zIyUUySiBtLS7tDmM";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadBusStatus() {
            const params = new URLSearchParams(window.location.search);
            const busName = params.get('bus');
            
            if(!busName) {
                document.getElementById('busTitle').innerText = "❌ Erreur: Aucune navette spécifiée";
                document.getElementById('loading').style.display = 'none';
                return;
            }
            
            document.getElementById('busTitle').innerText = "🚌 Navette : " + busName;

            try {
                let res1 = await fetch(`${SUPABASE_URL}/rest/v1/tokens_navette?bus_employe=eq.${encodeURIComponent(busName)}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });
                let tokens = await res1.json();

                let res2 = await fetch(`${SUPABASE_URL}/rest/v1/navette_reponses?select=email_employe,choix,created_at&order=created_at.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
                });
                let responses = await res2.json();

                document.getElementById('loading').style.display = 'none';

                let userStatus = {};
                responses.forEach(r => {
                    if(r.email_employe && r.choix) {
                        let emailKey = r.email_employe.trim().toLowerCase();
                        if(!userStatus[emailKey]) {
                            userStatus[emailKey] = r.choix.trim();
                        }
                    }
                });

                let ul = document.getElementById('passengersList');
                ul.innerHTML = "";

                if(tokens.length === 0) {
                    ul.innerHTML = "<p style='text-align:center; color:#64748b;'>Aucun employé trouvé pour cette navette.</p>";
                    document.getElementById('passengerCounter').innerText = "Nombre total de personnes confirmées : 0";
                    return;
                }

                tokens.sort((a, b) => (a.nom_employe || "").localeCompare(b.nom_employe || ""));

                let totalConfirmes = 0;

                tokens.forEach(emp => {
                    let li = document.createElement('li');
                    li.className = "list-item";
                    
                    let email = (emp.email || "").trim().toLowerCase();
                    let choix = userStatus[email] || "";
                    let choixLower = choix.toLowerCase();
                    
                    let nameDiv = document.createElement('div');
                    nameDiv.className = "emp-name";
                    nameDiv.innerText = emp.nom_employe || emp.email.split('@')[0];
                    
                    let statusDiv = document.createElement('div');
                    
                    // الإصلاح هنا: التحقق من وجود Retour وعدم وجود Depart في نفس الوقت
                    if (!choix) {
                        statusDiv.innerHTML = "⏳ En attente";
                        statusDiv.className = "status-wait";
                    } 
                    else if (choixLower.includes("pas") || choixLower.includes("annul")) {
                        statusDiv.innerHTML = "🚫 Pas de navette";
                        statusDiv.className = "status-cancel";
                    } 
                    else if (choixLower.includes("retour") && !choixLower.includes("depart")) {
                        statusDiv.innerHTML = "↩️ Retour Uniquement";
                        statusDiv.className = "status-retour";
                        totalConfirmes++;
                    }
                    else {
                        // هنا تدخل حالات (Depart Uniquement) و (Depart & Retour) معاً
                        statusDiv.innerHTML = "✔️ Confirmé";
                        statusDiv.className = "status-ok";
                        totalConfirmes++;
                    }

                    li.appendChild(nameDiv);
                    li.appendChild(statusDiv);
                    ul.appendChild(li);
                });

                document.getElementById('passengerCounter').innerText = "Nombre total de personnes confirmées : " + totalConfirmes;

            } catch (error) {
                console.error(error);
                document.getElementById('busTitle').innerText = "⚠️ Erreur de connexion";
            }
        }
        
        loadBusStatus();

        supabaseClient
          .channel('public:navette_reponses')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'navette_reponses' }, payload => {
              loadBusStatus(); 
          })
          .subscribe();
    </script>
</body>
</html>
