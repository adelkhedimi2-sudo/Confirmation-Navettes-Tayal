<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Navettes - TAYAL</title>
    <!-- استدعاء مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #003366;
            text-align: center;
            margin-bottom: 5px;
        }
        .bus-title {
            text-align: center;
            color: #E65100;
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        /* تصميم عداد الأشخاص */
        .counter-box {
            background-color: #e3f2fd;
            border: 2px solid #1565c0;
            color: #0d47a1;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #003366;
            color: #ffffff;
            font-size: 14px;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }
        .bg-depart { background-color: #e3f2fd; color: #1565c0; }
        .bg-retour { background-color: #ffebee; color: #c62828; } /* لون أحمر واضح لـ Retour */
        .bg-both { background-color: #f3e5f5; color: #7b1fa2; }
        .bg-none { background-color: #eceff1; color: #455a64; }
        .loading {
            text-align: center;
            font-size: 16px;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Suivi en Direct - Navettes TAYAL</h2>
    <div id="busName" class="bus-title">Chargement du bus...</div>

    <!-- عنصر لعرض عداد الأشخاص الموجودين في الحافلة -->
    <div id="passengerCounter" class="counter-box">
        Nombre total de personnes dans le bus : 0
    </div>

    <div id="loading" class="loading">Chargement des données...</div>

    <table id="resultsTable" style="display: none;">
        <thead>
            <tr>
                <th>Employé</th>
                <th>Destination</th>
                <th>Choix Confirmé</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- سيتم تعبئة البيانات برمجياً -->
        </tbody>
    </table>
</div>

<script>
    // إعدادات الاتصال بقاعدة بيانات Supabase (نفس بيانات مشروعك)
    const SUPABASE_URL = 'https://your-supabase-url.supabase.co'; // استبدل برابط قاعدة بياناتك
    const SUPABASE_ANON_KEY = 'your-supabase-anon-key'; // استبدل بمفتاحك السري العام
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // استخراج اسم الحافلة من رابط الصفحة (Query Parameter)
    const urlParams = new URLSearchParams(window.location.search);
    const busCode = urlParams.get('bus');

    if (busCode) {
        document.getElementById('busName').innerText = "Navette / Bus : " + decodeURIComponent(busCode);
        chargerDonneesBus(decodeURIComponent(busCode));
    } else {
        document.getElementById('busName').innerText = "Aucun bus spécifié.";
        document.getElementById('loading').style.display = 'none';
    }

    async function chargerDonneesBus(bus) {
        try {
            // جلب البيانات من جدول Supabase الخاص بالموظفين والحافلات وتأكيداتها
            const { data, error } = await _supabase
                .from('confirmations_navettes') // اسم جدول Supabase لديك
                .select('*')
                .eq('bus', bus);

            if (error) throw error;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let totalPersonnes = 0; // عداد الأشخاص

            if (data && data.length > 0) {
                data.forEach(row => {
                    let choixAffiche = '';
                    let badgeClass = '';
                    let estCompte = true; // لتحديد ما إذا كان الشخص محسوباً في الحافلة

                    // ترجمة الخيارات وتخصيص اللون الأحمر لـ "Retour" (العودة فقط)
                    if (row.choix === 'Depart') {
                        choixAffiche = 'Départ Uniquement';
                        badgeClass = 'bg-depart';
                    } else if (row.choix === 'Retour') {
                        choixAffiche = 'Retour Uniquement (A أكد العودة فقط)';
                        badgeClass = 'bg-retour'; // اللون الأحمر المميز
                    } else if (row.choix === 'Depart_Retour' || row.choix === 'Depart & Retour') {
                        choixAffiche = 'Départ & Retour';
                        badgeClass = 'bg-both';
                    } else if (row.choix === 'Pas_De_Navette') {
                        choixAffiche = 'Pas de navette';
                        badgeClass = 'bg-none';
                        estCompte = false; // من لم يستقل الناقلة لا يُحسب في العدد الإجمالي
                    } else {
                        choixAffiche = row.choix || 'En attente';
                        badgeClass = 'bg-none';
                        estCompte = false;
                    }

                    // زيادة العداد إذا كان الشخص قد أكد رحلة ضمن الناقلة
                    if (estCompte && row.choix && row.choix !== 'Pas_De_Navette') {
                        totalPersonnes++;
                    }

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${row.nom || 'Inكوننو'}</strong></td>
                        <td>${row.destination || 'Non spécifiée'}</td>
                        <td><span class="badge ${badgeClass}">${choixAffiche}</span></td>
                    `;
                    tbody.appendChild(tr);
                });

                // تحديث نص عداد الأشخاص في الصفحة
                document.getElementById('passengerCounter').innerText = "Nombre total de personnes dans le bus : " + totalPersonnes;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultsTable').style.display = 'table';
            } else {
                document.getElementById('loading').innerText = "Aucune confirmation enregistrée pour ce bus pour le moment.";
                document.getElementById('passengerCounter').innerText = "Nombre total de personnes dans le bus : 0";
            }
        } catch (err) {
            console.error("Erreur de chargement :", err);
            document.getElementById('loading').innerText = "Erreur lors du chargement des données.";
        }
    }
</script>

</body>
</html>
