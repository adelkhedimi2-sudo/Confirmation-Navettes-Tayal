<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi en Direct - Navettes TAYAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #003366;
            text-align: center;
            margin-bottom: 5px;
        }
        .bus-title {
            text-align: center;
            color: #E65100;
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #003366;
            color: #ffffff;
            font-size: 14px;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }
        .bg-depart { background-color: #e3f2fd; color: #1565c0; }
        .bg-retour { background-color: #e8f5e9; color: #2e7d32; }
        .bg-both { background-color: #f3e5f5; color: #7b1fa2; }
        .bg-none { background-color: #eceff1; color: #455a64; }
        .loading {
            text-align: center;
            font-size: 16px;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Suivi en Direct - Navettes TAYAL</h2>
    <div id="busName" class="bus-title">Chargement du bus...</div>
    
    <div id="loading" class="loading">Chargement des données...</div>

    <table id="resultsTable" style="display: none;">
        <thead>
            <tr>
                <th>Employé</th>
                <th>Destination</th>
                <th>Choix Confirmé</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- سيتم تعبئة البيانات برمجياً -->
        </tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = 'ضع_رابط_قاعدة_بيانات_supabase_هنا'; 
    const SUPABASE_ANON_KEY = 'ضع_مفتاح_anon_key_هنا';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const busCode = urlParams.get('bus');

    if (busCode) {
        document.getElementById('busName').innerText = "Navette / Bus : " + decodeURIComponent(busCode);
        chargerDonneesBus(decodeURIComponent(busCode));
    } else {
        document.getElementById('busName').innerText = "Aucun bus spécifié.";
        document.getElementById('loading').style.display = 'none';
    }

    async function chargerDonneesBus(bus) {
        try {
            const { data, error } = await _supabase
                .from('confirmations_navettes')
                .select('*')
                .eq('bus', bus);

            if (error) throw error;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(row => {
                    let choixAffiche = '';
                    let badgeClass = '';

                    if (row.choix === 'Depart') {
                        choixAffiche = 'Départ Uniquement';
                        badgeClass = 'bg-depart';
                    } else if (row.choix === 'Retour') {
                        choixAffiche = 'Retour Uniquement';
                        badgeClass = 'bg-retour';
                    } else if (row.choix === 'Depart_Retour' || row.choix === 'Depart & Retour') {
                        choixAffiche = 'Départ & Retour';
                        badgeClass = 'bg-both';
                    } else if (row.choix === 'Pas_De_Navette') {
                        choixAffiche = 'Pas de navette';
                        badgeClass = 'bg-none';
                    } else {
                        choixAffiche = row.choix || 'En attente';
                        badgeClass = 'bg-none';
                    }

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${row.nom || 'Employé'}</strong></td>
                        <td>${row.destination || 'Non spécifiée'}</td>
                        <td><span class="badge ${badgeClass}">${choixAffiche}</span></td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultsTable').style.display = 'table';
            } else {
                document.getElementById('loading').innerText = "Aucune confirmation enregistrée pour le moment.";
            }
        } catch (err) {
            console.error("Erreur de chargement :", err);
            document.getElementById('loading').innerText = "Erreur lors du chargement des données.";
        }
    }
</script>

</body>
</html>
