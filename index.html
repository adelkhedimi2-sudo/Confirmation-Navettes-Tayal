<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation Navette - TAYAL</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 5px solid #003366;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #003366;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success-icon { color: #4CAF50; font-size: 55px; margin-bottom: 10px; }
        .error-icon { color: #F44336; font-size: 55px; margin-bottom: 10px; }
        h1 { color: #003366; margin-bottom: 10px; }
        h2 { font-size: 18px; color: #333; }
        p { color: #666; line-height: 1.6; font-size: 16px; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1>TAYAL Transport</h1>
    <p>Vérification du délai en cours...</p>
    <div class="spinner" id="loading-spinner"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    const choix = urlParams.get('choix');
    const debutStr = urlParams.get('debut');
    const finStr = urlParams.get('fin');

    const container = document.getElementById('main-container');

    if (!email || !choix) {
        container.style.borderTop = "5px solid #F44336";
        container.innerHTML = `
            <div class="error-icon">⚠️</div>
            <h1 style="color: #F44336;">Erreur de Lien</h1>
            <p>Le lien utilisé est invalide. Veuillez utiliser les boutons envoyés dans votre email.</p>
        `;
        throw new Error("Paramètres manquants.");
    }

    // =========================================================================
    // 1. جلب الوقت الفعلي للإنترنت (توقيت الجزائر) لمنع أي تلاعب بساعة الحاسوب
    // =========================================================================
    fetch('https://worldtimeapi.org/api/timezone/Africa/Algiers')
        .then(response => {
            if (!response.ok) throw new Error("Erreur Serveur");
            return response.json();
        })
        .then(timeData => {
            const realNow = new Date(timeData.datetime); // وقت الإنترنت المستحيل تزويره
            verifierTemps(realNow);
        })
        .catch(error => {
            fetch(window.location.href, { method: 'HEAD' })
                .then(res => {
                    const realNow = new Date(res.headers.get('Date')); 
                    verifierTemps(realNow);
                })
                .catch(() => {
                     container.style.borderTop = "5px solid #FF9800";
                     container.innerHTML = `<div class="error-icon" style="color: #FF9800;">📶</div><h1 style="color: #FF9800;">Erreur Réseau</h1><p>Veuillez vérifier votre connexion internet.</p>`;
                });
        });

    // =========================================================================
    // 2. دالة التحقق من الصلاحية بناءً على الوقت الحقيقي
    // =========================================================================
    function verifierTemps(realNow) {
        if (debutStr && finStr) {
            const startDate = new Date(debutStr + "+01:00");
            const endDate = new Date(finStr + "+01:00");

            if (realNow < startDate || realNow > endDate) {
                container.style.borderTop = "5px solid #F44336";
                container.innerHTML = `
                    <div class="error-icon">⏳</div>
                    <h1 style="color: #F44336;">Délai Expiré</h1>
                    <h2>انتهى وقت التسجيل</h2>
                    <p>La période d'inscription pour la navette est terminée.<br>Vous ne pouvez plus confirmer pour le moment.</p>
                `;
                return; // إيقاف كل شيء هنا
            }
        }
        // تمرير الوقت الحقيقي للجزائر إلى دالة الإرسال
        envoyerReponse(realNow);
    }

    // =========================================================================
    // 3. دالة إرسال الإجابة إلى قاعدة البيانات (Supabase) + إرسال الإشعار لبريدك
    // =========================================================================
    function envoyerReponse(tempsReel) {
        const supabaseUrl = 'https://dsmflhnjmnllvhkuepit.supabase.co/rest/v1/navette_reponses';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzbWZsaG5qbW5sbHZoa3VlcGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDkzNDksImV4cCI6MjEwODU4NTM0OX0.lZTNCcKa_GW22fIPNGvDyH-sJ-zIyUUySiBtLS7tDmM';

        const data = {
            email_employe: email,
            choix: choix
        };

        fetch(supabaseUrl, {
            method: 'POST',
            headers: {
                'apikey': supabaseKey,
                'Authorization': 'Bearer ' + supabaseKey,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (response.ok || response.status === 201) {
                let choixText = choix;
                if(choix === "Depart") choixText = "Départ";
                else if(choix === "Retour") choixText = "Retour";
                else if(choix === "Depart_Retour") choixText = "Départ / Retour";
                else if(choix === "Pas_De_Navette") choixText = "Pas De Navette";

                container.style.borderTop = "5px solid #4CAF50";
                container.innerHTML = `
                    <div class="success-icon">✔️</div>
                    <h1 style="color: #4CAF50;">Confirmation Réussie</h1>
                    <p>Merci <b>${email.split('@')[0]}</b>.</p>
                    <p>Votre choix <b style="color: #003366;">(${choixText})</b> a été enregistré avec succès.</p>
                `;

                // =====================================================================
                // 🌟 كود إرسال الإشعار الفوري إلى إيميلك (التصميم الاحترافي + التوقيت الدقيق) 🌟
                // =====================================================================
                // تحويل الوقت الحقيقي للسيرفر إلى توقيت الجزائر ليظهر بشكل صحيح في الجدول
                const heureAlgerie = tempsReel.toLocaleString('fr-FR', { timeZone: 'Africa/Algiers' });
                const adminEmail = "adel.khedimi@tayal.dz"; 
                
                fetch(`https://formsubmit.co/ajax/${adminEmail}`, {
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        _subject: `📢 Navette TAYAL : ${email.split('@')[0]} a répondu !`,
                        _template: "box", 
                        "👤 Employé": email,
                        "📌 Choix de la navette": choixText,
                        "🕒 Heure de confirmation": heureAlgerie
                    })
                }).then(res => res.json())
                  .then(data => console.log("Notification envoyée avec succès."))
                  .catch(err => console.log("Erreur lors de l'envoi de la notification."));
                // =====================================================================

            } else {
                container.style.borderTop = "5px solid #F44336";
                container.innerHTML = `<div class="error-icon">❌</div><h1 style="color: #F44336;">Erreur</h1><p>Vous avez déjà soumis votre réponse, ou une erreur technique s'est produite.</p>`;
            }
        })
        .catch(error => {
            container.style.borderTop = "5px solid #FF9800";
            container.innerHTML = `<div class="error-icon" style="color: #FF9800;">📶</div><h1 style="color: #FF9800;">Problème de connexion</h1><p>Impossible de joindre le serveur. Veuillez vérifier votre connexion.</p>`;
        });
    }
</script>

</body>
</html>
