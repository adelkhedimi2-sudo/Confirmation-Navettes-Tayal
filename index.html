<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation Navette - TAYAL</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .container { background-color: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; border-top: 5px solid #003366; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #003366; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success-icon { color: #4CAF50; font-size: 55px; margin-bottom: 10px; }
        .error-icon { color: #F44336; font-size: 55px; margin-bottom: 10px; }
        h1 { color: #003366; margin-bottom: 10px; }
        p { color: #666; line-height: 1.6; font-size: 16px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box;}
        .btn-submit { background-color: #003366; color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s;}
        .btn-submit:hover { background-color: #FF9800; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1>TAYAL Transport</h1>
    <p>Verification de securite en cours...</p>
    <div class="spinner" id="loading-spinner"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const emailRaw = urlParams.get('email');
    const email = emailRaw ? emailRaw.trim() : null;
    const choix = urlParams.get('choix');
    const destStr = urlParams.get('dest');         
    const tokenURL = urlParams.get('token');  

    const container = document.getElementById('main-container');
    let realTimeGlobal = null;
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzbWZsaG5qbW5sbHZoa3VlcGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDkzNDksImV4cCI6MjEwODU4NTM0OX0.lZTNCcKa_GW22fIPNGvDyH-sJ-zIyUUySiBtLS7tDmM';

    if (!email || !choix) {
        container.style.borderTop = "5px solid #F44336";
        container.innerHTML = `<div class="error-icon">⚠️</div><h1 style="color: #F44336;">Erreur de Lien</h1><p>Le lien utilise est invalide.</p>`;
        throw new Error("Parametres manquants.");
    }

    // الخطوة 0: التحقق أولاً من أن العامل موجود في قائمة المصرح لهم (Tokens Supabase)
    const baseUrlToken = 'https://dsmflhnjmnllvhkuepit.supabase.co/rest/v1/tokens_navette';
    const queryUrlToken = new URL(baseUrlToken);
    queryUrlToken.searchParams.append('email', `eq.${email}`);
    queryUrlToken.searchParams.append('select', 'token');

    fetch(queryUrlToken.toString(), {
        method: 'GET',
        headers: { 
            'apikey': supabaseKey, 
            'Authorization': 'Bearer ' + supabaseKey,
            'Accept': 'application/json'
        },
        cache: 'no-store'
    })
    .then(res => {
        if (!res.ok) throw new Error("Erreur verification token");
        return res.json();
    })
    .then(data => {
        if (!data || data.length === 0) {
            // إذا لم يتم العثور على الإيميل في قاعدة البيانات المعتمدة
            container.style.borderTop = "5px solid #F44336";
            container.innerHTML = `
                <div class="error-icon">❌</div>
                <h1 style="color: #F44336;">Accès Refusé</h1>
                <p style="color: #c53030; font-weight: bold; font-size: 16px; line-height: 1.5;">
                    أنت غير موجود في قائمة العمال، يرجى الاتصال بمسؤول النقل ليتم إضافتك.
                </p>
            `;
            throw new Error("Employe non autorise.");
        }

        const dbToken = data[0].token;
        if (dbToken && dbToken !== tokenURL) {
            afficherLienExpire();
            throw new Error("Lien expire.");
        }

        // إذا اجتاز التحقق، نبدأ بجلب الوقت والتحقق من الحجز
        lancerVerificationTempsEtStatut();
    })
    .catch(err => {
        if (err.message !== "Employe non autorise." && err.message !== "Lien expire.") {
            console.error("Erreur Token:", err);
            lancerVerificationTempsEtStatut();
        }
    });

    function lancerVerificationTempsEtStatut() {
        // جلب الوقت الحقيقي مع مهلة لتفادي التجمّد
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);

        fetch('https://worldtimeapi.org/api/timezone/Africa/Algiers', { signal: controller.signal })
            .then(res => { clearTimeout(timeoutId); if (!res.ok) throw new Error(); return res.json(); })
            .then(data => { realTimeGlobal = new Date(data.datetime); verifierStatutEmploye(realTimeGlobal); })
            .catch(() => {
                fetch(window.location.href, { method: 'HEAD' })
                    .then(res => { realTimeGlobal = new Date(res.headers.get('Date')); verifierStatutEmploye(realTimeGlobal); })
                    .catch(() => { realTimeGlobal = new Date(); verifierStatutEmploye(realTimeGlobal); });
            });
    }

    function afficherLienExpire() {
        container.style.borderTop = "5px solid #F44336";
        container.innerHTML = `
            <div class="error-icon">❌</div>
            <h1 style="color: #F44336;">Lien Expire</h1>
            <p>Ce lien n'est plus valide car vous avez recu un <b>nouvel email</b> plus recent.</p>
            <div style="background-color: #fff3e0; padding: 15px; border-radius: 8px; border-left: 5px solid #FF9800; display: inline-block; margin-top: 10px;">
                <b style="color: #d84315;">Veuillez utiliser le lien contenu dans le dernier email recu.</b>
            </div>
        `;
    }

    // 2. التحقق من سجل العامل في قاعدة البيانات (بدون قيود وقت)
    function verifierStatutEmploye(tempsReel) {
        const baseUrl = 'https://dsmflhnjmnllvhkuepit.supabase.co/rest/v1/navette_reponses';
        
        const queryUrl = new URL(baseUrl);
        queryUrl.searchParams.append('email_employe', `eq.${email}`);
        queryUrl.searchParams.append('select', 'choix');

        fetch(queryUrl.toString(), {
            method: 'GET',
            headers: { 
                'apikey': supabaseKey, 
                'Authorization': 'Bearer ' + supabaseKey,
                'Accept': 'application/json'
            },
            cache: 'no-store'
        })
        .then(res => {
            if (!res.ok) throw new Error(`GET HTTP Error: ${res.status}`);
            return res.json();
        })
        .then(data => {
            if (data && data.length > 0) {
                const ancienChoix = data[0].choix || "";
                const hasModif = ancienChoix.includes("[MODIFIE]");

                if (choix === "Pas_De_Navette") {
                    if (ancienChoix.startsWith("Annulation")) {
                        afficherDejaEnregistre("Annulation");
                        return;
                    }
                    
                    let textToSave = "Annulation";
                    let actionBtn = determinerAction("Pas_De_Navette");
                    if (hasModif) {
                        textToSave += " [MODIFIE]";
                        actionBtn += " (Modifie)";
                    }
                    
                    container.innerHTML = `<p>Annulation en cours...</p><div class="spinner"></div>`;
                    let destFinale = destStr ? destStr.trim() : "Non Specifiee";
                    executerEnregistrement(tempsReel, textToSave, actionBtn, destFinale, 'PATCH');
                    return;
                }

                let destFinale = destStr ? destStr.trim() : "Non Specifiee";
                let nouveauChoixTexte = determinerTexteChoix(choix, destFinale);

                if (hasModif) {
                    if (ancienChoix === (nouveauChoixTexte + " [MODIFIE]") && choix !== "Changer") {
                        afficherDejaEnregistre(nouveauChoixTexte);
                    } else {
                        afficherErreurModif();
                    }
                    return;
                }

                if (ancienChoix === nouveauChoixTexte && choix !== "Changer") {
                    afficherDejaEnregistre(nouveauChoixTexte);
                    return;
                }

                afficherAvertissementModification(tempsReel, ancienChoix, nouveauChoixTexte);

            } else {
                traiterNouveauChoix(tempsReel, false);
            }
        })
        .catch(err => {
            container.innerHTML = `<div class="error-icon">📶</div><h1 style="color: #FF9800;">Erreur Reseau</h1><p>Impossible de verifier l'historique.</p>`;
        });
    }

    function afficherDejaEnregistre(texte) {
        let cleanText = texte.replace(" [MODIFIE]", "");
        container.style.borderTop = "5px solid #FF9800";
        container.innerHTML = `
            <div class="error-icon" style="color:#FF9800;">⚠️</div>
            <h1 style="color: #FF9800;">Deja Enregistre !</h1>
            <p style="font-size: 18px; font-weight: bold; color: #FF9800; margin-bottom: 5px;">لقد قمت بالفعل باختيار :</p>
            <div style="background-color: #fff3e0; padding: 15px; border-radius: 8px; border-left: 5px solid #FF9800; display: inline-block; margin-top: 10px;">
                <b style="color: #FF9800; font-size: 18px;">${cleanText}</b>
            </div>
        `;
    }

    function afficherErreurModif() {
        container.style.borderTop = "5px solid #F44336";
        container.innerHTML = `
            <div class="error-icon">❌</div>
            <h1 style="color: #F44336;">Modification Refusee</h1>
            <p>Vous avez deja utilise votre droit de modification <b>unique</b>.</p>
        `;
    }

    function afficherAvertissementModification(tempsReel, ancienChoix, nouveauChoixTexte) {
        let cleanAncien = ancienChoix.replace(" [MODIFIE]", "");
        container.style.borderTop = "5px solid #FF9800";
        
        let destinationForm = "";
        if (choix === "Changer") {
            destinationForm = `
                <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
                <div class="form-group">
                    <label>Nouvelle Destination :</label>
                    <input type="text" id="inputNewDest" placeholder="Ex: Oran, Chlef, Alger..." required>
                </div>
                <div class="form-group">
                    <label>Trajet souhaite :</label>
                    <select id="selectTrajet">
                        <option value="Depart">Depart uniquement</option>
                        <option value="Retour">Retour uniquement</option>
                        <option value="Depart_Retour" selected>Depart et Retour</option>
                    </select>
                </div>
                <button class="btn-submit" style="background-color: #FF9800;" onclick="soumettreChangementModif()">Confirmer la modification</button>
            `;
        } else {
            destinationForm = `
                <p>Voulez-vous vraiment changer vers : <br><b style="color:#003366;">${nouveauChoixTexte}</b> ?</p>
                <button class="btn-submit" style="background-color: #FF9800;" onclick="confirmerModifDefinitive()">Confirmer la modification</button>
            `;
        }

        container.innerHTML = `
            <div class="error-icon" style="color:#FF9800;">⚠️</div>
            <h1 style="color: #FF9800;">Attention</h1>
            <p>Vous avez deja enregistre : <br><b>${cleanAncien}</b></p>
            ${destinationForm}
        `;

        window.confirmerModifDefinitive = function() {
            container.innerHTML = `<p>Enregistrement en cours...</p><div class="spinner"></div>`;
            traiterNouveauChoix(tempsReel, true); 
        }

        window.soumettreChangementModif = function() {
            const nouvelleDest = document.getElementById('inputNewDest').value.trim();
            const nouveauTrajet = document.getElementById('selectTrajet').value;
            if (nouvelleDest === "") { alert("Veuillez saisir votre nouvelle destination."); return; }
            container.innerHTML = `<p>Enregistrement en cours...</p><div class="spinner"></div>`;
            let finalTxt = determinerTexteChoix(nouveauTrajet, nouvelleDest) + " [MODIFIE]";
            let finalAction = determinerAction(nouveauTrajet) + " (Modifie)";
            executerEnregistrement(tempsReel, finalTxt, finalAction, nouvelleDest, 'PATCH');
        }
    }

    function traiterNouveauChoix(tempsReel, isModification) {
        if (choix === "Changer") {
            container.style.borderTop = "5px solid #003366";
            container.innerHTML = `
                <h1>Modifier la destination</h1>
                <p>Votre destination actuelle : <b style="color:#2196F3;">${destStr || "Non Specifiee"}</b></p>
                <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
                <div class="form-group">
                    <label>Nouvelle Destination :</label>
                    <input type="text" id="inputNewDest" placeholder="Ex: Oran, Chlef, Alger..." required>
                </div>
                <div class="form-group">
                    <label>Trajet souhaite :</label>
                    <select id="selectTrajet">
                        <option value="Depart">Depart uniquement</option>
                        <option value="Retour">Retour uniquement</option>
                        <option value="Depart_Retour" selected>Depart et Retour</option>
                    </select>
                </div>
                <button class="btn-submit" onclick="soumettreNouveauChangement()">Enregistrer</button>
            `;
            
            window.soumettreNouveauChangement = function() {
                const nouvelleDest = document.getElementById('inputNewDest').value.trim();
                const nouveauTrajet = document.getElementById('selectTrajet').value;
                if (nouvelleDest === "") { alert("Veuillez saisir votre nouvelle destination."); return; }
                container.innerHTML = `<p>Enregistrement en cours...</p><div class="spinner"></div>`;
                
                let finalTxt = determinerTexteChoix(nouveauTrajet, nouvelleDest);
                let finalAction = determinerAction(nouveauTrajet);
                let reqMethod = isModification ? 'PATCH' : 'POST';
                if (isModification) { finalTxt += " [MODIFIE]"; finalAction += " (Modifie)"; }
                
                executerEnregistrement(tempsReel, finalTxt, finalAction, nouvelleDest, reqMethod);
            }
        } else {
            let destFinale = destStr ? destStr.trim() : "Non Specifiee";
            let choixFinalText = determinerTexteChoix(choix, destFinale);
            let actionBtn = determinerAction(choix);
            let reqMethod = isModification ? 'PATCH' : 'POST';

            if (isModification) {
                choixFinalText += " [MODIFIE]";
                actionBtn += " (Modifie)";
            }

            executerEnregistrement(tempsReel, choixFinalText, actionBtn, destFinale, reqMethod);
        }
    }

    function determinerTexteChoix(typeChoix, destination) {
        if (typeChoix === "Pas_De_Navette") return "Annulation";
        let prefix = "";
        if (typeChoix === "Depart") prefix = "Depart";
        else if (typeChoix === "Retour") prefix = "Retour";
        else if (typeChoix === "Depart_Retour") prefix = "Depart / Retour";
        return `${prefix} (Vers: ${destination})`;
    }

    function determinerAction(typeChoix) {
        if (typeChoix === "Pas_De_Navette") return "❌ Annulation de la navette";
        if (typeChoix === "Depart") return "➡️ Depart uniquement";
        if (typeChoix === "Retour") return "⬅️ Retour uniquement";
        if (typeChoix === "Depart_Retour") return "🔄 Depart et Retour";
        return typeChoix;
    }

    // التسجيل في قاعدة البيانات
    function executerEnregistrement(tempsReel, choixFinalEnregistre, actionBtn, destFinale, reqMethod) {
        const baseUrl = 'https://dsmflhnjmnllvhkuepit.supabase.co/rest/v1/navette_reponses';

        const finalUrl = new URL(baseUrl);
        if (reqMethod === 'PATCH') {
            finalUrl.searchParams.append('email_employe', `eq.${email}`);
        }

        const headers = {
            'apikey': supabaseKey,
            'Authorization': 'Bearer ' + supabaseKey,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
        };

        const data = { email_employe: email, choix: choixFinalEnregistre };

        fetch(finalUrl.toString(), { method: reqMethod, headers: headers, body: JSON.stringify(data) })
        .then(response => {
            if (response.ok || response.status === 201 || response.status === 204) {
                container.style.borderTop = "5px solid #4CAF50";
                container.innerHTML = `
                    <div class="success-icon">✔️</div>
                    <h1 style="color: #4CAF50;">Operation Reussie</h1>
                    <p>Merci <b>${email.split('@')[0].toUpperCase()}</b>.</p>
                    <p>Votre choix a ete enregistre avec succes.</p>
                `;

                const heureAlgerie = tempsReel.toLocaleString('fr-FR', { timeZone: 'Africa/Algiers' });
                const adminEmail = "adel.khedimi@tayal.dz";
                let nomEmploye = email.split('@')[0].replace('.', ' ').toUpperCase();

                fetch(`https://formsubmit.co/ajax/${adminEmail}`, {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        _subject: `📢 Navette : ${nomEmploye} a repondu !`,
                        _template: "table",
                        "👤 Nom & Prenom": nomEmploye,
                        "📧 Email": email,
                        "🔘 Choix effectue": actionBtn,
                        "📍 Destination": destFinale,
                        "🕒 Heure (Algerie)": heureAlgerie
                    })
                }).catch(() => console.log("FormSubmit Error"));
            } else {
                return response.json().then(errData => {
                    throw new Error(errData.message || response.status);
                });
            }
        })
        .catch(error => {
            container.style.borderTop = "5px solid #F44336";
            container.innerHTML = `
                <div class="error-icon">❌</div>
                <h1 style="color: #F44336;">Erreur</h1>
                <p>Impossible d'enregistrer.</p>
                <p style="color: #F44336; font-size: 13px; margin-top: 15px;">(Detail technique: ${error.message})</p>
            `;
        });
    }
</script>

</body>
</html>
